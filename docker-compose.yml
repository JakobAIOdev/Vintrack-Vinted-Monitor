x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    container_name: vintrack_caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      VINTRACK_SITE_ADDRESS: ${VINTRACK_SITE_ADDRESS:-vintrack.jakobaio.dev}
    depends_on:
      - control-center
    mem_limit: ${CADDY_MEM_LIMIT:-64m}
    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: vintrack_db
    # Defaults are sized for the documented target: a small single-host VPS.
    # Raise them via .env on larger hardware. Two values matter most here:
    # effective_cache_size, because the stock 4GB makes the planner assume warm
    # cache it does not have, and synchronous_commit, because monitor telemetry
    # is high-volume and disposable and should not sit in the fsync path.
    command: >
      postgres
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-48MB}
      -c work_mem=${POSTGRES_WORK_MEM:-4MB}
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
      -c autovacuum_max_workers=${POSTGRES_AUTOVACUUM_MAX_WORKERS:-2}
      -c synchronous_commit=${POSTGRES_SYNCHRONOUS_COMMIT:-off}
      -c wal_compression=on
      -c max_wal_size=2GB
      -c min_wal_size=256MB
      -c checkpoint_timeout=15min
      -c random_page_cost=1.1
      -c autovacuum_naptime=15s
      -c autovacuum_vacuum_cost_limit=1000
    # Parallel query and parallel vacuum allocate through /dev/shm, which Docker
    # defaults to 64MB.
    shm_size: ${POSTGRES_SHM_SIZE:-256m}
    environment:
      POSTGRES_USER: vinuser
      POSTGRES_PASSWORD: vinpassword
      POSTGRES_DB: vintrack
      # The worker buckets hourly telemetry in UTC. A non-UTC session timezone
      # would silently shift every bucket and truncate the dashboard windows.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinuser -d vintrack"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Deliberately unbounded by default. A cgroup limit does not make Postgres
    # use less memory, it makes the kernel kill a backend or the postmaster when
    # shared_buffers plus per-backend memory plus autovacuum workers exceed it,
    # and losing Postgres takes the whole stack down. The settings above are
    # what actually bounds its footprint; set POSTGRES_MEM_LIMIT only if you
    # have measured real usage against it.
    mem_limit: ${POSTGRES_MEM_LIMIT:-0}
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vintrack_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-192mb} --maxmemory-policy allkeys-lru --stop-writes-on-bgsave-error no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Leave headroom above maxmemory for the AOF rewrite fork, which transiently
    # increases resident memory.
    mem_limit: ${REDIS_MEM_LIMIT:-320m}
    logging: *default-logging
    restart: unless-stopped

  control-center:
    build:
      context: ./apps/control-center
      dockerfile: Dockerfile
    image: ghcr.io/jakobaiodev/vintrack-vinted-monitor/control-center:latest
    container_name: vintrack_control_center
    environment:
      # Prisma otherwise derives its pool from the host CPU count, which ignores
      # any container limit and scales with hardware rather than with load.
      - DATABASE_URL=postgresql://vinuser:vinpassword@postgres:5432/vintrack?connection_limit=${PRISMA_CONNECTION_LIMIT:-5}
      - REDIS_URL=redis://redis:6379
      - NODE_OPTIONS=--max-old-space-size=${CONTROL_CENTER_HEAP_MB:-320}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_DISCORD_ID=${AUTH_DISCORD_ID}
      - AUTH_DISCORD_SECRET=${AUTH_DISCORD_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:3000}
      - SEO_INDEXING_ENABLED=${SEO_INDEXING_ENABLED:-false}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:3000}
      - VINTED_SERVICE_URL=http://vinted-service:4000
      - BROWSER_EXTENSION_LATEST_VERSION=${BROWSER_EXTENSION_LATEST_VERSION:-0.1.6}
      - BROWSER_EXTENSION_MIN_VERSION=${BROWSER_EXTENSION_MIN_VERSION:-0.1.5}
      - BROWSER_EXTENSION_FIREFOX_URL=${BROWSER_EXTENSION_FIREFOX_URL:-https://addons.mozilla.org/firefox/addon/vintrack-browser-sync/}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - AUTH_OIDC_ISSUER=${AUTH_OIDC_ISSUER:-}
      - AUTH_OIDC_CLIENT_ID=${AUTH_OIDC_CLIENT_ID:-}
      - AUTH_OIDC_CLIENT_SECRET=${AUTH_OIDC_CLIENT_SECRET:-}
      - AUTH_OIDC_NAME=${AUTH_OIDC_NAME:-}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID:-}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET:-}
      - GITHUB_REPOSITORY_WEBHOOK_SECRET=${GITHUB_REPOSITORY_WEBHOOK_SECRET:-}
      - GITHUB_SPONSORS_WEBHOOK_SECRET=${GITHUB_SPONSORS_WEBHOOK_SECRET:-}
      - GITHUB_REWARDS_MAINTAINER_TOKEN=${GITHUB_REWARDS_MAINTAINER_TOKEN:-}
      - GITHUB_REWARDS_SYNC_SECRET=${GITHUB_REWARDS_SYNC_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      control-center-migrate:
        condition: service_completed_successfully
    mem_limit: ${CONTROL_CENTER_MEM_LIMIT:-512m}
    logging: *default-logging
    restart: unless-stopped

  github-rewards-scheduler:
    image: ghcr.io/jakobaiodev/vintrack-vinted-monitor/control-center:latest
    container_name: vintrack_github_rewards_scheduler
    command: ["node", "scripts/github-rewards-scheduler.mjs"]
    environment:
      - GITHUB_REWARDS_SYNC_URL=http://control-center:3000/api/internal/github-rewards/sync
      - GITHUB_REWARDS_SYNC_SECRET=${GITHUB_REWARDS_SYNC_SECRET:-}
    depends_on:
      control-center:
        condition: service_started
    mem_limit: ${GITHUB_REWARDS_SCHEDULER_MEM_LIMIT:-64m}
    logging: *default-logging
    restart: unless-stopped

  control-center-migrate:
    build:
      context: ./apps/control-center
      dockerfile: Dockerfile
    image: ghcr.io/jakobaiodev/vintrack-vinted-monitor/control-center:latest
    container_name: vintrack_migrate
    command: ["sh", "-c", "npx prisma migrate deploy"]
    environment:
      - DATABASE_URL=postgresql://vinuser:vinpassword@postgres:5432/vintrack
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: "no"

  vinted-service:
    build:
      context: ./apps/vinted-service
      dockerfile: Dockerfile
    image: ghcr.io/jakobaiodev/vintrack-vinted-monitor/vinted-service:latest
    container_name: vintrack_vinted
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - DATABASE_URL=postgres://vinuser:vinpassword@postgres:5432/vintrack?sslmode=disable
      - VINTED_SESSION_ENCRYPTION_KEY=${VINTED_SESSION_ENCRYPTION_KEY}
      - LISTEN_ADDR=:4000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-center-migrate:
        condition: service_completed_successfully
    mem_limit: ${VINTED_SERVICE_MEM_LIMIT:-128m}
    logging: *default-logging
    restart: unless-stopped

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    image: ghcr.io/jakobaiodev/vintrack-vinted-monitor/worker:latest
    container_name: vintrack_worker
    environment:
      - WORKER_ROLE=monitor
      - DATABASE_URL=postgres://vinuser:vinpassword@postgres:5432/vintrack?sslmode=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - PROXY_FILE=/app/proxies.txt
      # A soft memory limit lets Go collect earlier instead of being OOM killed.
      # A kill here discards every in-flight alert that has not reached the
      # outbox yet, so staying alive matters more than peak throughput.
      - GOMEMLIMIT=${WORKER_GOMEMLIMIT:-340MiB}
      - GOGC=${WORKER_GOGC:-80}
      - DB_MAX_OPEN_CONNS=${WORKER_DB_MAX_OPEN_CONNS:-20}
      - ALERT_DB_POOL_SIZE=${ALERT_DB_POOL_SIZE:-6}
      - VINTED_FETCH_MODE=${VINTED_FETCH_MODE:-live}
      - VINTED_MOCK_SCENARIO=${VINTED_MOCK_SCENARIO:-new-items}
      - VINTED_MOCK_DROP_INTERVAL_MS=${VINTED_MOCK_DROP_INTERVAL_MS:-3000}
      - ENRICH_SELLER_INFO=${ENRICH_SELLER_INFO:-true}
      - CLIENT_POOL_SIZE=${CLIENT_POOL_SIZE:-5}
      - FREE_PROXY_CLIENT_POOL_SIZE=${FREE_PROXY_CLIENT_POOL_SIZE:-50}
      - TLS_PROFILE=${TLS_PROFILE:-chrome_146}
      - CATALOG_TIMEOUT_MS=${CATALOG_TIMEOUT_MS:-2000}
      - FREE_PROXY_CATALOG_TIMEOUT_MS=${FREE_PROXY_CATALOG_TIMEOUT_MS:-3500}
      - CATALOG_HEDGE_DELAY_MS=${CATALOG_HEDGE_DELAY_MS:-250}
      - FREE_PROXY_CATALOG_HEDGE_DELAY_MS=${FREE_PROXY_CATALOG_HEDGE_DELAY_MS:-900}
      - CATALOG_MAX_ATTEMPTS=${CATALOG_MAX_ATTEMPTS:-5}
      - DISCOVERY_MODE=${DISCOVERY_MODE:-off}
      - DISCOVERY_ALLOW_FREE_ACTIVE=${DISCOVERY_ALLOW_FREE_ACTIVE:-false}
      - DISCOVERY_INTERVAL_MS=${DISCOVERY_INTERVAL_MS:-500}
      - DISCOVERY_FREE_INTERVAL_MS=${DISCOVERY_FREE_INTERVAL_MS:-500}
      - DISCOVERY_PER_PAGE=${DISCOVERY_PER_PAGE:-96}
      - DISCOVERY_FREE_PER_PAGE=${DISCOVERY_FREE_PER_PAGE:-64}
      - DISCOVERY_MAX_BACKFILL_PAGES=${DISCOVERY_MAX_BACKFILL_PAGES:-3}
      - DISCOVERY_FREE_CLIENT_POOL_SIZE=${DISCOVERY_FREE_CLIENT_POOL_SIZE:-8}
      - DISCOVERY_FREE_TIMEOUT_MS=${DISCOVERY_FREE_TIMEOUT_MS:-3000}
      - DISCOVERY_FREE_HEDGE_DELAY_MS=${DISCOVERY_FREE_HEDGE_DELAY_MS:-150}
      - ALERT_WORKERS=${ALERT_WORKERS:-8}
      - ALERT_DELIVERY_WORKERS=${ALERT_DELIVERY_WORKERS:-16}
      # Individual item pages are intentionally handled by a small dedicated
      # pool: responses are large and must not compete with catalog monitors.
      - PRICE_WATCH_ENABLED=${PRICE_WATCH_ENABLED:-true}
      - PRICE_WATCH_WORKERS=${PRICE_WATCH_WORKERS:-4}
      - PRICE_WATCH_TRANSPORT_MODE=${PRICE_WATCH_TRANSPORT_MODE:-auto}
      - PRICE_WATCH_CLIENT_POOL_SIZE=${PRICE_WATCH_CLIENT_POOL_SIZE:-4}
      - PRICE_WATCH_TIMEOUT_MS=${PRICE_WATCH_TIMEOUT_MS:-6000}
      - PRICE_WATCH_HTML_LIMIT_BYTES=${PRICE_WATCH_HTML_LIMIT_BYTES:-3145728}
      - TELEGRAM_GLOBAL_RATE_PER_SECOND=${TELEGRAM_GLOBAL_RATE_PER_SECOND:-25}
      - TELEGRAM_GLOBAL_BURST=${TELEGRAM_GLOBAL_BURST:-25}
      - ENRICHMENT_WORKERS=${ENRICHMENT_WORKERS:-24}
      - SELLER_ENRICHMENT_TIMEOUT_MS=${SELLER_ENRICHMENT_TIMEOUT_MS:-2000}
      - SELLER_CLIENT_POOL_SIZE=${SELLER_CLIENT_POOL_SIZE:-16}
      - SELLER_CACHE_TTL_MINUTES=${SELLER_CACHE_TTL_MINUTES:-30}
      - SELLER_HEDGE_DELAY_MS=${SELLER_HEDGE_DELAY_MS:-350}
      - SELLER_NEGATIVE_CACHE_TTL_MS=${SELLER_NEGATIVE_CACHE_TTL_MS:-3000}
      - CATALOG_LATENCY_METRICS=${CATALOG_LATENCY_METRICS:-true}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:3000}
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:3000}
    volumes:
      - ./apps/worker/proxies.txt:/app/proxies.txt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-center-migrate:
        condition: service_completed_successfully
    mem_limit: ${WORKER_MEM_LIMIT:-384m}
    logging: *default-logging
    restart: unless-stopped

  id-scanner:
    profiles: ["preindex"]
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    image: ghcr.io/jakobaiodev/vintrack-vinted-monitor/worker:latest
    container_name: vintrack_id_scanner
    environment:
      - WORKER_ROLE=id-scanner
      - DATABASE_URL=postgres://vinuser:vinpassword@postgres:5432/vintrack?sslmode=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - PROXY_FILE=/app/proxies.txt
      - ID_SCANNER_ENABLED=${ID_SCANNER_ENABLED:-false}
      - ID_SCANNER_REGION=${ID_SCANNER_REGION:-de}
      - ID_SCANNER_STRIDE=${ID_SCANNER_STRIDE:-100}
      - ID_SCANNER_INTERVAL_MS=${ID_SCANNER_INTERVAL_MS:-500}
      - ID_SCANNER_JITTER_MS=${ID_SCANNER_JITTER_MS:-200}
      - ID_SCANNER_TIMEOUT_MS=${ID_SCANNER_TIMEOUT_MS:-2000}
      - ID_SCANNER_POOL_SIZE=${ID_SCANNER_POOL_SIZE:-16}
      - ID_SCANNER_PROXY_OFFSET=${ID_SCANNER_PROXY_OFFSET:-32}
      - ID_SCANNER_STUCK_SKIP_AFTER=${ID_SCANNER_STUCK_SKIP_AFTER:-10}
      - ID_SCANNER_MAX_AHEAD=${ID_SCANNER_MAX_AHEAD:-10000}
      - TLS_PROFILE=${TLS_PROFILE:-chrome_146}
    volumes:
      - ./apps/worker/proxies.txt:/app/proxies.txt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-center-migrate:
        condition: service_completed_successfully
    logging: *default-logging
    restart: unless-stopped

  proxy-maintainer:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    image: ghcr.io/jakobaiodev/vintrack-vinted-monitor/worker:latest
    container_name: vintrack_proxy_maintainer
    environment:
      - WORKER_ROLE=proxy-maintainer
      - DATABASE_URL=postgres://vinuser:vinpassword@postgres:5432/vintrack?sslmode=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - PROXY_FILE=/app/proxies.txt
      - GOMEMLIMIT=${PROXY_MAINTAINER_GOMEMLIMIT:-180MiB}
      - GOGC=${WORKER_GOGC:-80}
      - DB_MAX_OPEN_CONNS=${PROXY_MAINTAINER_DB_MAX_OPEN_CONNS:-6}
      - ALERT_DB_POOL_SIZE=${PROXY_MAINTAINER_ALERT_DB_POOL_SIZE:-2}
      - MONITOR_RUN_RETENTION_HOURS=${MONITOR_RUN_RETENTION_HOURS:-24}
      - MONITOR_RUN_STATS_RETENTION_DAYS=${MONITOR_RUN_STATS_RETENTION_DAYS:-90}
      - DETECTION_RETENTION_DAYS=${DETECTION_RETENTION_DAYS:-14}
      - PREINDEX_PROBE_RETENTION_HOURS=${PREINDEX_PROBE_RETENTION_HOURS:-48}
      - PREINDEX_SAMPLE_RETENTION_DAYS=${PREINDEX_SAMPLE_RETENTION_DAYS:-14}
      - FREE_PROXY_HEALTH_CONCURRENCY=${FREE_PROXY_HEALTH_CONCURRENCY:-64}
      - FREE_PROXY_HEALTH_PER_REGION_CONCURRENCY=${FREE_PROXY_HEALTH_PER_REGION_CONCURRENCY:-12}
      - FREE_PROXY_HEALTH_BATCH_PER_REGION=${FREE_PROXY_HEALTH_BATCH_PER_REGION:-100}
      - FREE_PROXY_BOOTSTRAP_BATCH_PER_REGION=${FREE_PROXY_BOOTSTRAP_BATCH_PER_REGION:-600}
      - TLS_PROFILE=${TLS_PROFILE:-chrome_146}
    volumes:
      - ./apps/worker/proxies.txt:/app/proxies.txt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-center-migrate:
        condition: service_completed_successfully
    mem_limit: ${PROXY_MAINTAINER_MEM_LIMIT:-200m}
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
